[project]
name = "sueros-potencial-pdv"
version = "0.1.0"
description = "Identificacion y priorizacion de puntos de venta con mayor potencial para la categoria de Sueros (KOF CDMX, Arca Guadalajara, Bepensa Merida)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "openpyxl>=3.1",
    "xlsxwriter>=3.2",
    "python-pptx>=1.0",
    "reportlab>=4.1",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
]

[tool.uv]
package = false
